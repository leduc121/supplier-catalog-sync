name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -count=1 -race ./...
      - name: Build CLI, server, and migrate tools
        run: |
          go build -o /tmp/catalog ./cmd/catalog
          go build -o /tmp/catalog-server ./cmd/server
          go build -o /tmp/catalog-migrate ./cmd/migrate
      - name: Validate deployment artifacts
        env:
          DOMAIN: catalog.example.com
          APP_IMAGE: supplier-catalog-sync:ci
        run: |
          docker compose config --quiet
          docker build -t supplier-catalog-sync:ci .
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e DOMAIN="$DOMAIN" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
